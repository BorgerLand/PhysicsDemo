name: Sync Docs

on:
    push:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions: {}

defaults:
    run:
        shell: bash

jobs:
    sync-docs:
        if: github.repository == 'BorgerLand/BlankTemplate'
        runs-on: ubuntu-latest
        steps:
            - name: Redeploy borger.dev
              env:
                  GH_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
              run: |
                  repo=BorgerLand/borger.dev
                  start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  gh workflow run deploy.yml --repo "$repo" --ref master

                  # workflow run doesn't return the run id, so find the dispatched run
                  run_id=
                  for _ in $(seq 1 30); do
                      run_id=$(gh run list --repo "$repo" --workflow deploy.yml --event workflow_dispatch \
                          --created ">=$start" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
                      [ -n "$run_id" ] && break
                      sleep 5
                  done
                  if [ -z "$run_id" ]; then
                      echo "::error::Could not find the dispatched deploy run"
                      exit 1
                  fi

                  # exits nonzero if the deploy fails
                  gh run watch "$run_id" --repo "$repo" --exit-status
